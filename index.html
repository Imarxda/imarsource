<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Servidores cerrados</title>
<style>
  :root {
    --nv-green: #76b900;
    --nv-green-hover: #8fd100;
    --bg: #000;
    --panel: #1a1a1a;
    --text: #fff;
    --muted: #a7a7a7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "DIN Next", "Segoe UI", Arial, Helvetica, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 32px;
    background: #000;
    border-bottom: 1px solid #2a2a2a;
  }
  .logo-mark {
    width: 34px; height: 34px;
    background: var(--nv-green);
    border-radius: 3px;
    display: grid; place-items: center;
  }
  .logo-mark svg { width: 20px; height: 20px; }
  .brand { font-weight: 700; font-size: 18px; letter-spacing: .5px; }
  .brand span { color: var(--nv-green); }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(118,185,0,.22), transparent 60%),
      linear-gradient(180deg, #0a0a0a 0%, #000 100%);
  }
  .card {
    max-width: 640px;
    width: 100%;
    text-align: left;
    border-left: 4px solid var(--nv-green);
    padding: 8px 0 8px 28px;
  }
  .status {
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--panel);
    border: 1px solid #333;
    padding: 6px 14px;
    border-radius: 2px;
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 24px;
  }
  .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #e5484d;
    animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .35; } }
  h1 {
    font-size: clamp(32px, 6vw, 56px);
    line-height: 1.05;
    font-weight: 700;
    margin-bottom: 20px;
  }
  p { font-size: 18px; line-height: 1.55; color: #d6d6d6; margin-bottom: 14px; max-width: 54ch; }
  p strong { color: var(--text); }
  .btn {
    display: inline-block;
    margin-top: 18px;
    background: var(--nv-green);
    color: #000;
    font-weight: 700;
    font-size: 16px;
    padding: 14px 32px;
    text-decoration: none;
    border-radius: 2px;
    transition: background .15s;
  }
  .btn:hover { background: var(--nv-green-hover); }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
  footer {
    padding: 20px 32px;
    font-size: 13px;
    color: #777;
    border-top: 1px solid #1f1f1f;
  }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  @media (max-width: 520px) {
    header { padding: 14px 20px; }
    .card { padding-left: 18px; }
    p { font-size: 16px; }
  }
</style>
</head>
<body>
  <header>
    <div class="brand">IMAR <span>SOURCE</span></div>
  </header>

  <main>
    <section class="card">
      <div class="status"><span class="dot"></span> Servidores fuera de servicio</div>
      <h1>Lamentamos las molestias</h1>
      <p>Los servidores se cerraron <strong>hasta nuevo aviso</strong>.</p>
      <p>Mientras tanto, puedes visitar <strong>@imar.xda</strong> para ver las fotos oficiales subidas.</p>
      <a class="btn" href="https://www.instagram.com/imar.xda/?hl=es-la" target="_blank" rel="noopener">Ver @imar.xda</a>
    </section>
  </main>

  <footer>Gracias por tu paciencia.</footer>
</body>
</html>
